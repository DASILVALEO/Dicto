<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="240" height="240" rx="48" fill="url(#bg)"/>

  <!-- Sound waves (left) -->
  <g stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 30 100 Q 50 120 30 140"/>
    <path d="M 50 80 Q 80 120 50 160" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Sound waves (right) -->
  <g stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 210 100 Q 190 120 210 140"/>
    <path d="M 190 80 Q 160 120 190 160" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Microphone body -->
  <rect x="90" y="55" width="60" height="100" rx="30" fill="url(#mic)"/>

  <!-- Microphone highlight -->
  <rect x="100" y="65" width="15" height="80" rx="7" fill="#ffffff" opacity="0.4"/>

  <!-- Microphone stand -->
  <line x1="120" y1="155" x2="120" y2="190" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="95" y1="190" x2="145" y2="190" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- "REC" indicator -->
  <circle cx="120" cy="92" r="8" fill="#ef4444"/>
  <text x="120" y="96" font-family="Segoe UI, sans-serif" font-size="11" font-weight="900" fill="white" text-anchor="middle">REC</text>
</svg>
