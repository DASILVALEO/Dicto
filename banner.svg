<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bannerBg)"/>

  <!-- Glow behind mic -->
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>

  <!-- Sound waves decorative -->
  <g stroke="#22c55e" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M 320 100 Q 380 200 320 300"/>
    <path d="M 350 70 Q 430 200 350 330" stroke-width="2" opacity="0.7"/>
    <path d="M 80 100 Q 20 200 80 300"/>
    <path d="M 50 70 Q -30 200 50 330" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Microphone -->
  <g transform="translate(140, 100)">
    <rect x="35" y="0" width="50" height="100" rx="25" fill="url(#textGrad)"/>
    <rect x="42" y="10" width="12" height="80" rx="6" fill="#ffffff" opacity="0.5"/>
    <line x1="60" y1="100" x2="60" y2="160" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="35" y1="160" x2="85" y2="160" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="60" cy="40" r="6" fill="#ef4444"/>
  </g>

  <!-- Title -->
  <text x="320" y="190" font-family="Segoe UI, -apple-system, sans-serif" font-size="120" font-weight="900" fill="url(#textGrad)" letter-spacing="-2">Dicto</text>

  <!-- Tagline (English) -->
  <text x="322" y="240" font-family="Segoe UI, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#bfdbfe">Voice to Text · Anywhere on Windows</text>

  <!-- Tagline (Spanish) -->
  <text x="322" y="278" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#93c5fd" opacity="0.85">"Dicto" en español = "Yo dicto" · Habla y se escribe solo</text>

  <!-- Badges -->
  <g transform="translate(322, 320)">
    <!-- Free badge -->
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#22c55e"/>
    <text x="50" y="22" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">FREE</text>

    <!-- Open Source badge -->
    <rect x="110" y="0" width="140" height="32" rx="16" fill="#ffffff" opacity="0.95"/>
    <text x="180" y="22" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">OPEN SOURCE</text>

    <!-- 4GB RAM badge -->
    <rect x="260" y="0" width="130" height="32" rx="16" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1.5"/>
    <text x="325" y="22" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">4 GB RAM</text>

    <!-- Windows badge -->
    <rect x="400" y="0" width="120" height="32" rx="16" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1.5"/>
    <text x="460" y="22" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Windows</text>
  </g>

  <!-- Bottom-right decoration -->
  <text x="1240" y="370" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#93c5fd" opacity="0.6" text-anchor="end">github.com/DASILVALEO/Dicto · MIT License</text>
</svg>
